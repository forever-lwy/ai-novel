services:
  ai-novel:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:4317:4317"
    environment:
      HOST: 0.0.0.0
      PORT: 4317
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - novel-data:/app/data
volumes:
  novel-data:
